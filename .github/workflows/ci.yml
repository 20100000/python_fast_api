name: Continuous Integration (CI)

# 🚀 Dispara a pipeline a cada commit na main ou ao abrir um Pull Request para a main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    # Servidor auxiliar para rodar o banco de dados PostgreSQL isolado do teste
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tiago_test
          POSTGRES_PASSWORD: tiago_test_password
          POSTGRES_DB: python_crud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiago_test -d python_crud_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Faz o download do código do repositório para a máquina do GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configura a versão correta do Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Otimiza o tempo de pipeline salvando o cache do pip

      # 3. Cria um arquivo .env temporário para os testes da API não quebrarem (Pydantic Settings)
      - name: Create Test .env File
        run: |
          echo "SECRET_KEY=github_actions_super_secret_key_for_testing_purposes_123" >> .env
          echo "ALGORITHM=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=60" >> .env
          echo "POSTGRES_USER=tiago_test" >> .env
          echo "POSTGRES_PASSWORD=tiago_test_password" >> .env
          echo "POSTGRES_DB=python_crud_test" >> .env
          echo "DATABASE_URL=postgresql://tiago_test:tiago_test_password@localhost:5432/python_crud_test" >> .env

      # 4. Instala as dependências listadas no requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Executa a suíte de testes com cobertura de código visível no log
      - name: Run Tests with Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest -v
