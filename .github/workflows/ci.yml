name: Continuous Integration (CI)

# 🚀 Dispara a pipeline a cada commit na main ou ao abrir um Pull Request para a main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite (SQLite)
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o download do código do repositório para o servidor do GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configura a versão estável do Python 3.11 com cache ativado para otimizar tempo
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Cria um arquivo .env temporário para que a API inicialize sem erros de validação do Pydantic
      - name: Create Dummy .env File
        run: |
          echo "SECRET_KEY=github_actions_super_secret_key_for_testing" >> .env
          echo "ALGORITHM=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=60" >> .env
          echo "POSTGRES_USER=dummy" >> .env
          echo "POSTGRES_PASSWORD=dummy" >> .env
          echo "POSTGRES_DB=dummy" >> .env
          echo "DATABASE_URL=sqlite:///:memory:" >> .env

      # 4. Instala o pip atualizado e todas as dependências do requirements.txt (FastAPI, Pytest, Bcrypt, PyJWT)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Executa a suíte de testes com verbosidade na velocidade da luz
      - name: Run Tests with Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest -v
